spring.application.name=pharmacy-service
server.port=4008
spring.profiles.default=local

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${APP_DDL_AUTO:update}
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone=${APP_EUREKA_URL}

services.patient.url=${APP_PATIENT_SERVICE_URL}
services.doctor.url=${APP_DOCTOR_SERVICE_URL}
services.clinical.url=${APP_CLINICAL_SERVICE_URL}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
