spring.application.name=appointment-service
server.port=4002
spring.profiles.default=local

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${APP_DDL_AUTO:update}

eureka.client.service-url.defaultZone=${APP_EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.enabled=true

services.patient.url=${APP_PATIENT_SERVICE_URL}
services.doctor.url=${APP_DOCTOR_SERVICE_URL}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

springdoc.packages-to-scan=com.pm.appointmentservice.interfaces.rest
